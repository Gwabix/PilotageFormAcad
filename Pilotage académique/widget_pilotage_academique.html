<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilotage académique – Formation continue</title>
    <script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
    <link rel="stylesheet" href="widget_pilotage_academique.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Pilotage académique de la formation continue</h1>
        </div>

        <div class="tabs">
            <button class="tab active" id="tabDepartement" data-tab="departement">Département</button>
            <button class="tab" id="tabAcademie" data-tab="academie">Académie</button>
        </div>

        <div id="conservation-check" class="conservation-check hidden" role="alert">
            <span id="conservation-check-text"></span>
            <button type="button" id="conservation-review-btn">Examiner et purger</button>
        </div>

        <div id="departement" class="tab-content active">
            <div class="search-section">
                <h2>Sélectionner un département</h2>
                <div id="radioDepartementsContainer" class="radio-container">
                    <!-- Les boutons radio seront générés dynamiquement par JavaScript -->
                </div>
            </div>
            <div id="resultsDepartement" class="results-container"></div>
        </div>

        <div id="academie" class="tab-content">
            <div id="resultsAcademie" class="results-container"></div>
        </div>
    </div>

    <!-- Popup purge RGPD -->
    <div id="conservation-modal-overlay" class="conservation-modal-overlay hidden">
        <div id="conservation-modal" class="conservation-modal" role="dialog" aria-modal="true" aria-labelledby="conservation-modal-title">
            <h2 id="conservation-modal-title">Purge RGPD</h2>
            <p id="conservation-modal-intro"></p>
            <ul id="conservation-modal-list"></ul>
            <p id="conservation-modal-warning">Cette suppression est définitive et ne peut pas être annulée.</p>
            <div class="conservation-modal-actions">
                <button type="button" id="conservation-cancel-btn">Annuler</button>
                <button type="button" id="conservation-confirm-btn">Supprimer définitivement</button>
            </div>
        </div>
    </div>

    <div id="conservation-toast-container" aria-live="polite"></div>

    <button id="scrollTopBtn" title="Retour haut de page">
        <span class="arrow-viewport">
            <span class="arrow-track">
                <span>↑</span>
                <span>↑</span>
            </span>
        </span>
    </button>

    <!-- Bibliothèques pour génération PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="../shared/rgpd-purge.js"></script>
    <script src="pilotage_academique.js"></script>
</body>

</html>
