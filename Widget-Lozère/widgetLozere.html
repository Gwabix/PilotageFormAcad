<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ecoles et PE</title>
    <script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
    <link rel="stylesheet" href="widgetLozere.css">
</head>

<body>
    <div id="app">
        <div id="topbar">
            <div id="search-wrap">
                <input id="search-input" type="text"
                    placeholder="Rechercher une ecole, commune, circonscription, UAI..." autocomplete="off"
                    spellcheck="false">
                <button id="search-clear" type="button" title="Effacer" aria-label="Effacer">&times;</button>
                <div id="suggestions" role="listbox"></div>
            </div>
            <div id="toolbar">
                <label class="year-pick" for="year-select">Année scolaire
                    <select id="year-select"></select>
                </label>
                <button class="btn" id="btn-expand" type="button">Tout déplier</button>
                <button class="btn" id="btn-collapse" type="button">Tout replier</button>
                <button class="btn" id="btn-pdf" type="button"
                    title="Ouvre la boîte d'impression : choisir « Enregistrer au format PDF »">Exporter en PDF</button>
                <span id="count-info"></span>
            </div>
        </div>
        <div id="list"></div>
    </div>
    <div id="export-overlay" hidden>
        <div id="export-dialog" role="dialog" aria-modal="true" aria-labelledby="export-title">
            <form id="export-form">
                <h2 id="export-title">Exporter en PDF</h2>
                <p id="export-status" role="status" hidden></p>
                <div id="export-fields" hidden>
                    <p class="export-label">Année scolaire</p>
                    <p id="export-year"></p>
                    <fieldset class="export-group">
                        <legend>Tableau des enseignants</legend>
                        <div id="export-cols-table" class="export-cols"></div>
                    </fieldset>
                    <fieldset class="export-group">
                        <legend>En-tête de chaque école</legend>
                        <div id="export-cols-header" class="export-cols"></div>
                    </fieldset>
                    <div class="export-quick">
                        <button class="btn-link" id="export-all" type="button">Tout cocher</button>
                        <button class="btn-link" id="export-none" type="button">Tout décocher</button>
                        <button class="btn-link" id="export-default" type="button">Sélection par défaut</button>
                    </div>
                    <p class="export-hint">Dans la boîte d'impression, choisir « Enregistrer au format PDF ».</p>
                </div>
                <div class="export-actions">
                    <button class="btn" id="export-cancel" type="button">Annuler</button>
                    <button class="btn btn-primary" id="export-go" type="submit">Exporter</button>
                </div>
            </form>
        </div>
    </div>
    <div id="cas-overlay" hidden>
        <div id="cas-dialog" role="dialog" aria-modal="true" aria-labelledby="cas-title">
            <form id="cas-form">
                <h2 id="cas-title">Cas particuliers</h2>
                <div id="cas-list"></div>
                <p id="cas-status" role="status" hidden></p>
                <div class="export-actions">
                    <button class="btn" id="cas-close" type="button" hidden>Fermer</button>
                    <button class="btn btn-primary" id="cas-go" type="submit">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
    <div id="print-root" aria-hidden="true"></div>
    <script src="calendrier-dates.js"></script>
    <script src="widgetLozere.js"></script>
</body>
</html>
