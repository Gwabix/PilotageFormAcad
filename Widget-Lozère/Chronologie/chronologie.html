<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan de formation</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link rel="stylesheet" href="chronologie.css">
</head>

<body>

    <div id="search-zone">
        <label for="search-input">École :</label>
        <div id="search-wrapper">
            <input type="text" id="search-input" placeholder="Rechercher une école…" autocomplete="off"
                spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false"
                aria-controls="dropdown" />
            <button type="button" id="search-clear" aria-label="Vider la recherche" title="Vider">×</button>
            <div id="dropdown" role="listbox" aria-label="Écoles"></div>
        </div>
    </div>

    <p id="status-msg" role="status">Chargement des données…</p>

    <main id="timeline-container" hidden>
        <h1 id="school-title"></h1>
        <p id="fil-rouge">
            <span class="ct-label">Compétence fil rouge :</span>
            <span id="ct-slot"></span>
        </p>
        <ol id="timeline" aria-label="Déroulé du plan de formation"></ol>
    </main>

    <div id="edit-overlay" hidden>
        <div id="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-title"
            aria-describedby="edit-context">
            <h2 id="edit-title">Modifier</h2>
            <p id="edit-context"></p>
            <div id="edit-autre-zone" hidden>
                <button type="button" id="edit-autre-choice" class="chip" aria-pressed="false"></button>
                <span class="edit-hint">ou saisissez un autre texte ci-dessous</span>
            </div>
            <textarea id="edit-input" spellcheck="true" aria-labelledby="edit-title"></textarea>
            <fieldset id="edit-modalite" hidden>
                <legend class="visually-hidden">Modalité retenue</legend>
            </fieldset>
            <p id="edit-error" role="alert"></p>
            <div id="edit-actions">
                <button type="button" id="edit-cancel" class="btn btn-secondary">Annuler</button>
                <button type="button" id="edit-save" class="btn btn-primary">Valider</button>
            </div>
        </div>
    </div>

    <script src="chronologie.js"></script>
</body>

</html>
